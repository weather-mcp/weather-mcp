name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      # Offline gate: `npm test` runs the unit and integration projects.
      # Unit runs under tests/setup/no-network.ts, which refuses every outbound socket.
      # Integration runs under tests/setup/loopback-only.ts. Local-server tests run,
      # but nothing reaches an upstream.
      # tests/live/ is never run in CI. Run it by hand with `npm run test:live`.
      - name: "Test (offline: unit + integration)"
        run: npm test
